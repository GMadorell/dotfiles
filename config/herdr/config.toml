onboarding = false

[experimental]
kitty_graphics = true

[ui.toast]
# The system toast can't route a click back to the specific agent pane that
# raised it (see the smart-notify plugin for that). Disabled here in favor of
# it; leaving on would double-fire notifications.
delivery = "off"

[theme]
name = "dracula"
auto_switch = false

[ui]
tab_bar_position = "bottom"
hide_tab_bar_when_single_tab = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
status_indicators = "symbols"
pane_gaps = false
pane_borders = true
pane_outer_borders = false
show_agent_labels_on_pane_borders = true

tab_bar_right = [
  { type = "zoom" },
  # Claude Code quota: 5h and weekly used %, each with countdown and wall-clock reset.
  # cclimits only reports relative resets, so jq derives the clock times.
  { type = "command", command = '''npx -y cclimits --claude --json | jq -r '.claude as $c | def mins: [scan("(\\d+)\\s*([dhm])")] | map((.[0]|tonumber) * (if .[1]=="d" then 1440 elif .[1]=="h" then 60 else 1 end)) | add; def pct: rtrimstr("%") | tonumber | round | tostring + "%"; def compact: gsub("\\s+"; ""); "\($c.five_hour.used|pct) \($c.five_hour.resets_in|compact) (\(now + (($c.five_hour.resets_in|mins)*60) | strflocaltime("%H:%M"))) │ \($c.seven_day.used|pct) \($c.seven_day.resets_in|compact) (\(now + (($c.seven_day.resets_in|mins)*60) | strflocaltime("%a %H:%M")))"' ''', interval_seconds = 60, timeout_seconds = 10 },
  { type = "datetime", format = "%b %d %H:%M" },
]
tab_bar_right_separator = " · "
agent_panel_sort = "spaces"

[keys]
prefix = "ctrl+space"

# Keymap vocabulary (shared with wezterm):
#   hjkl     = where   (direction)
#   letter   = what    (verb)
#   modifier = which tier: bare = pane, ctrl = tab, ctrl+alt = workspace
#   (plain alt is avoided: macOS composes alt+letter into accented chars)

# --- direction: hjkl -------------------------------------------------------
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# --- verb: n = new ---------------------------------------------------------
split_vertical = "prefix+n"         # new pane to the right
split_horizontal = "prefix+shift+n" # new pane below
new_tab = "prefix+ctrl+n"
new_workspace = "prefix+ctrl+alt+n"
new_worktree = "prefix+ctrl+alt+shift+n"

# --- verb: x = close -------------------------------------------------------
close_pane = "prefix+x"
close_tab = "prefix+ctrl+x"
close_workspace = "prefix+ctrl+alt+x"

# --- verb: r = rename ------------------------------------------------------
rename_pane = "prefix+r"
rename_tab = "prefix+ctrl+r"
rename_workspace = "prefix+ctrl+alt+r"

# --- verb: f = find --------------------------------------------------------
goto = "prefix+f"
workspace_picker = "prefix+ctrl+alt+f"

# --- workspace navigation ---------------------------------------------------
switch_workspace = "prefix+ctrl+alt+1..9"
previous_workspace = "prefix+ctrl+alt+,"
next_workspace = "prefix+ctrl+alt+."

navigate_workspace_up = "k"
navigate_workspace_down = "j"

# --- tab navigation --------------------------------------------------------
switch_tab = "prefix+1..9"
previous_tab = "prefix+,"
next_tab = "prefix+."

# --- pane cycling ----------------------------------------------------------
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"

# --- singletons ------------------------------------------------------------
zoom = "prefix+z"
resize_mode = "prefix+g" # g = grow
copy_mode = "prefix+v"
edit_scrollback = "prefix+e"
settings = "prefix+s"
reload_config = "prefix+shift+s"
toggle_sidebar = "prefix+b"
detach = "prefix+q"
help = "prefix+?"
open_notification_target = "prefix+o"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "herdr-navigator.open"
